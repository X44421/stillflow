# StillFlow — backend development feedback loop (DX-F0, Issue #85).
#
# Launch from the repository root:
#
#   bacon              # default job: fast workspace check
#   bacon <job-name>   # any job declared below
#
# Contract of every job in this file:
#   - read-only: no auto-fix (`--fix`), no lockfile updates (`cargo update`),
#     no retry-on-failure logic;
#   - no hidden warnings: warnings are surfaced, clippy denies them;
#   - deterministic inputs only: no wall-clock seeds, no random data;
#   - normal Rust test-runner parallelism; tests that share mutable process
#     state must own an explicit scoped lock instead of serializing the workspace;
#   - no retry-on-race behavior; a parallel-only failure is an isolation bug.
#
# All commands address the Cargo workspace living under `backend/` through
# `--manifest-path`, so this root-level configuration works from the repo root.

default_job = "check"

# Tier 0 — fastest loop: compiler diagnostics over the whole backend workspace.
[jobs.check]
command = [
    "cargo",
    "check",
    "--manifest-path",
    "backend/Cargo.toml",
    "--workspace",
    "--all-targets",
]

# Same as `check`, forced onto the MSRV toolchain regardless of what the
# active default is. Requires rustup with the 1.85.0 toolchain installed.
[jobs.check-msrv]
command = [
    "cargo",
    "+1.85.0",
    "check",
    "--manifest-path",
    "backend/Cargo.toml",
    "--workspace",
    "--all-targets",
]

# Formatting gate — identical to CI. Never formats files (`--check` only).
[jobs.fmt]
command = [
    "cargo",
    "fmt",
    "--manifest-path",
    "backend/Cargo.toml",
    "--all",
    "--",
    "--check",
]

# Lint gate — identical to CI. Warnings are hard errors.
[jobs.clippy]
command = [
    "cargo",
    "clippy",
    "--manifest-path",
    "backend/Cargo.toml",
    "--workspace",
    "--all-targets",
    "--",
    "-D",
    "warnings",
]

# Tier 1 — focused library tests for the execution engine.
[jobs.test-engine]
command = [
    "cargo",
    "test",
    "--manifest-path",
    "backend/Cargo.toml",
    "-p",
    "stillflow-engine",
    "--lib",
]

# Tier 2 — full local gate: every workspace test with normal runner parallelism.
[jobs.test-workspace]
command = [
    "cargo",
    "test",
    "--manifest-path",
    "backend/Cargo.toml",
    "--workspace",
]

# Override bacon's built-in `test` job only to bind it to the backend workspace.
[jobs.test]
command = [
    "cargo",
    "test",
    "--manifest-path",
    "backend/Cargo.toml",
    "--workspace",
]
