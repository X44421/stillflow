name: Temporary Rust artifacts

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: issue-007-rust-artifacts
  cancel-in-progress: true

jobs:
  rust-artifacts:
    if: github.head_ref == 'agent/issue-007-lockfile-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Update lockfile through the normal workspace build
        run: cargo check --workspace
        working-directory: backend
      - run: cargo fmt --all
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: issue-007-rust-sources
          path: |
            backend
            !backend/target
          if-no-files-found: error
