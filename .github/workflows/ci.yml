name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Backend gates expose distinct evidence rather than duplicating the same
  # full suite across toolchains (DX-F0 #85, DX-T1 #204). Rust 1.85.0 is the
  # canonical fmt + lint + semantic-test authority; stable adds compatibility
  # compile and newer-Clippy drift coverage.

  backend-fmt-msrv:
    name: Backend fmt (Rust 1.85.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-1.85.0
      - run: cargo fmt --all -- --check

  backend-clippy-msrv:
    name: Backend clippy (Rust 1.85.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-1.85.0
      - run: cargo clippy --workspace --all-targets -- -D warnings

  backend-tests-msrv:
    name: Backend tests (Rust 1.85.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-1.85.0
      - run: cargo test --workspace -- --skip total_output_cap_is_accepted_at_eight_gib_and_enforced_above

  backend-clippy-stable:
    name: Backend clippy (stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-stable
      - run: cargo clippy --workspace --all-targets -- -D warnings

  backend-check-stable:
    name: Backend compatibility check (stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: backend-stable
      - run: cargo check --workspace --all-targets
