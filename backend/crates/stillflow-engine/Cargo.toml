[package]
name = "stillflow-engine"
description = "Ingestion execution and orchestration for Stillflow sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# O0-B1-A1 experiment (#147): private, non-default per-run lowering/type-check
# cache. Feature OFF retains the exact current production path; ON adds an
# Engine-private cache keyed by exact compiled step/rule position + schema
# state fingerprint, populated lazily at the same observable execution point.
# Never enabled by default.
engine-lowering-cache = []

[dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
arrow-buffer = "59"
arrow-data = "59"
arrow-schema = { workspace = true, features = ["ffi"] }
chrono.workspace = true
futures.workspace = true
polars = { version = "0.46", default-features = false, features = [
    "lazy",
    "strings",
    "dtype-u8",
    "dtype-u16",
    "dtype-i8",
    "dtype-i16",
    "dtype-date",
    "dtype-datetime",
    "dtype-struct",
] }
polars-arrow = "0.46"
stillflow-connectors.workspace = true
stillflow-core.workspace = true
stillflow-plan.workspace = true
stillflow-storage.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
tempfile.workspace = true
