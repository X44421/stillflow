[package]
name = "stillflow-engine"
description = "Ingestion execution and orchestration for Stillflow sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
arrow-cast.workspace = true
arrow-data = "59"
arrow-schema = { workspace = true, features = ["ffi"] }
arrow-select.workspace = true
chrono.workspace = true
futures.workspace = true
polars = { version = "0.46", default-features = false, features = [
    "lazy",
    "strings",
    "regex",
    "dtype-u8",
    "dtype-u16",
    "dtype-i8",
    "dtype-i16",
    "dtype-date",
    "dtype-datetime",
    "dtype-struct",
] }
polars-arrow = "0.46"
stillflow-connectors.workspace = true
stillflow-core.workspace = true
stillflow-plan.workspace = true
stillflow-storage.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
tempfile.workspace = true
