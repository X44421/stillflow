[package]
name = "stillflow-connector-local-tabular"
description = "Bounded local CSV, TSV, JSON, NDJSON and Parquet connector for Stillflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
arrow-cast.workspace = true
arrow-data = "59"
arrow-schema = { workspace = true, features = ["ffi"] }
arrow-select.workspace = true
async-trait.workspace = true
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chrono.workspace = true
csv = "1.3"
futures.workspace = true
polars = { version = "0.55", default-features = false, features = [
    "csv",
    "dtype-date",
    "dtype-datetime",
    "dtype-struct",
    "json",
    "parquet",
] }
polars-arrow = "0.55"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
stillflow-connectors.workspace = true
stillflow-core.workspace = true
uuid.workspace = true

[dev-dependencies]
parquet.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
