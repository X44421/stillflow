[package]
name = "stillflow-connector-local-tabular"
description = "Bounded local CSV, TSV, JSON, NDJSON and Parquet connector for Stillflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
arrow-cast.workspace = true
arrow-data = "59"
arrow-schema = { workspace = true, features = ["ffi"] }
arrow-select.workspace = true
async-trait.workspace = true
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chrono.workspace = true
csv = "1.3"
futures.workspace = true
polars = { version = "0.46", default-features = false, features = [
    "csv",
    "dtype-date",
    "dtype-datetime",
    "dtype-struct",
    "json",
    "parquet",
] }
polars-arrow = "0.46"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
stillflow-connectors.workspace = true
stillflow-core.workspace = true
uuid.workspace = true

[dev-dependencies]
parquet.workspace = true
sha2.workspace = true
stillflow-engine.workspace = true
stillflow-plan.workspace = true
stillflow-storage.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# Private measurement-only feature for the E24-B2BASE ingestion baseline and
# the O0-C1 CSV duplicate-work attribution (issue #285). Never enabled by
# default; adds logical-byte/parser-invocation/wall-time counters and a
# test-binary dump side channel only. No dependency and no behavior change.
[features]
io-metrics = []
# The E24-JSON-A2 direct projected writer path (issue #158) is productionized
# by O1-J1 (issue #296): both projected-row paths are always compiled and the
# routing is a runtime connection-config key (`jsonDirectProjectedWriter`,
# default `false` = the generic DOM path). See
# docs/issues/issue-296-o1-j1-json-direct-read-path-contract.md. Default
# enablement remains a separate decision gated on combined-regression evidence.
