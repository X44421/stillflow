[package]
name = "stillflow-connector-local-tabular"
description = "Bounded local CSV, TSV, JSON, NDJSON and Parquet connector for Stillflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
arrow-cast.workspace = true
arrow-data = "59"
arrow-schema = { workspace = true, features = ["ffi"] }
arrow-select.workspace = true
async-trait.workspace = true
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chrono.workspace = true
csv = "1.3"
futures.workspace = true
polars = { version = "0.46", default-features = false, features = [
    "csv",
    "dtype-date",
    "dtype-datetime",
    "dtype-struct",
    "json",
    "parquet",
] }
polars-arrow = "0.46"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
stillflow-connectors.workspace = true
stillflow-core.workspace = true
uuid.workspace = true

[dev-dependencies]
parquet.workspace = true
sha2.workspace = true
stillflow-engine.workspace = true
stillflow-plan.workspace = true
stillflow-storage.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# Private measurement-only feature for the E24-B2BASE ingestion baseline and
# the O0-C1 CSV duplicate-work attribution (issue #285). Never enabled by
# default; adds logical-byte/parser-invocation/wall-time counters and a
# test-binary dump side channel only. No dependency and no behavior change.
[features]
io-metrics = []
# Private E24-JSON-A2 direct projected writer path (issue #158, continuing the
# accepted #148 experiment). Never enabled by default and never enabled through
# production configuration. Capability-only: enabling it turns on serde_json's
# `raw_value` capability so selected JSON values are captured as borrowed raw
# slices instead of a generic `serde_json::Value` tree. With the feature off,
# the crate builds and behaves exactly as before; no dependency or version
# changes (features are not recorded in Cargo.lock). The former default
# enablement blocker (#151 temporal upstream boundary,
# `TIMESTAMP_ROOT_CAUSE_POLARS_UPSTREAM`) was resolved by the connector-side
# temporal fix in PR #225: declared timestamp units, timezone epoch semantics
# and pre-1970 values are normalized identically on the generic and this
# direct projected path before the shared Polars JsonReader (revalidated with
# parity and performance evidence under issue #283). Enabling it as the
# default remains a separate productionization decision; this feature stays
# measurement-only until then.
json-direct-projected-writer = ["serde_json/raw_value"]
