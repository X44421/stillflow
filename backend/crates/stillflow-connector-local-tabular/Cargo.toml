[package]
name = "stillflow-connector-local-tabular"
description = "Bounded local CSV, TSV, JSON, NDJSON and Parquet connector for Stillflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
arrow-cast.workspace = true
arrow-data = "59"
arrow-schema = { workspace = true, features = ["ffi"] }
arrow-select.workspace = true
async-trait.workspace = true
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chrono.workspace = true
csv = "1.3"
futures.workspace = true
polars = { version = "0.46", default-features = false, features = [
    "csv",
    "dtype-date",
    "dtype-datetime",
    "dtype-struct",
    "json",
    "parquet",
] }
polars-arrow = "0.46"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
stillflow-connectors.workspace = true
stillflow-core.workspace = true
uuid.workspace = true

[dev-dependencies]
arrow-json = "59"
parquet.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true

# Private measurement-only feature for the E24-B2BASE ingestion baseline.
# Never enabled by default; adds logical-byte/parser-invocation counters and a
# test-binary dump side channel only. No dependency and no behavior change.
[features]
io-metrics = []
# Private E24-JSON-A2 direct projected writer path (issue #158, continuing the
# accepted #148 experiment). Never enabled by default and never enabled through
# production configuration. Capability-only: enabling it turns on serde_json's
# `raw_value` capability so selected JSON values are captured as borrowed raw
# slices instead of a generic `serde_json::Value` tree. With the feature off,
# the crate builds and behaves exactly as before; no dependency or version
# changes (features are not recorded in Cargo.lock). Default enablement is
# blocked on the #151 temporal upstream boundary (`TIMESTAMP_ROOT_CAUSE_POLARS_UPSTREAM`):
# this path retains the shared Polars JsonReader unchanged and adds no
# timestamp compensation, so it must not become the default until the affected
# timestamp surface is routed around, fail-closed, or fixed upstream.
json-direct-projected-writer = ["serde_json/raw_value"]
