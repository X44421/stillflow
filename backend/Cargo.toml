[workspace]
resolver = "2"
members = [
    "crates/stillflow-api",
    "crates/stillflow-connectors",
    "crates/stillflow-core",
    "crates/stillflow-engine",
    "crates/stillflow-plan",
    "crates/stillflow-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Shared dependency declarations. Exact versions are pinned by the
# committed Cargo.lock; members inherit them with `.workspace = true`.
[workspace.dependencies]
# Internal crates. Dependency direction is strictly one-way:
# api -> engine -> {plan, connectors, storage} -> core (no cycles).
stillflow-api = { path = "crates/stillflow-api" }
stillflow-connectors = { path = "crates/stillflow-connectors" }
stillflow-core = { path = "crates/stillflow-core" }
stillflow-engine = { path = "crates/stillflow-engine" }
stillflow-plan = { path = "crates/stillflow-plan" }
stillflow-storage = { path = "crates/stillflow-storage" }

# Third-party crates shared across members.
arrow-array = "59"
arrow-schema = "59"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
fs2 = "0.4"
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["serde", "v4"] }
